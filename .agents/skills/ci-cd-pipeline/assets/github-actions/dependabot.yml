# Copy to .github/dependabot.yml. Keeps SHA-pinned actions and dependencies up to date.
# The cooldown waits 7 days after a release before proposing it, so a compromised release is more likely
# to be detected and yanked before it reaches you.
# Replace or add package ecosystems to match the project (npm, pip, uv, gomod, cargo, maven, gradle, nuget, docker).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
